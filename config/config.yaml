samples: config/samples.tsv

##### Databases #####
# MMseqs2 nr database used for contig taxonomy (own build, Oct 2026)
mmseqs2_db: /scratch/lukabostjancic/ViroCray/2026_10_mmseq2/nr.fnaDB
# MMseqs2 splits the database to stay under the cap: lower = less memory, but slower.
mmseqs2_split_memory_limit: 200G
# SPAdes memory limit in GB (-m); the largest sample so far needed 93 GB
spades_memory_gb: 120
# nr database for DIAMOND blastx: BLAST nr (DIAMOND >= 2.x reads it directly, incl. taxonomy)
diamond_nr_db: /biodbs/blastdb/220.ncbi/nr
# NCBI new_taxdump dir with names.dmp/nodes.dmp (needed by DIAMOND for sscinames)
diamond_taxdump: resources/taxdump

##### Contig filtering #####
# Minimum contig length (nt) kept after assembly
min_contig_length: 500

##### Clustering #####
filter_edges:
  min_ani: 90.0        # minimum ANI (%) between two contigs
  filter_mode: AF      # "AF" (aligned fraction) or "HSP" (longest HSP length)
  min_hsp_len: 150     # used only when filter_mode is HSP
  min_af: 0.80         # aligned fraction of the shorter contig, used only when filter_mode is AF
clustering:
  resolution: 1.0      # Leiden resolution

##### Read mapping #####
bbmap:
  minid: 0.90
  maxindel: 3
coverm:
  min_read_percent_identity: 95
  min_read_aligned_percent: 95

##### Abundance filtering #####
filter_read_counts:
  min_reads: 2
  min_covered_fraction: 0.25
  min_covered_bases: 400

##### Functional annotation #####
getorf:
  min_orf_nt: 300      # minimum ORF length in nt (300 nt = 100 aa)
  table: 1             # genetic code (1 = standard)
annotation_chunks: 20  # ORFs are split into this many chunks for InterProScan / hmmsearch
interproscan:
  path: /scratch/lukabostjancic/ViroCray/interproscan/interproscan-5.78-109.0/interproscan.sh
  applications: Pfam,CDD,SUPERFAMILY,Gene3D,ProSiteProfiles,NCBIfam
neordrp:
  hmm: /biodbs/NeoRdRp2/NeoRdRp.2.1.hmm
  evalue: 1e-10        # E-value used in the NeoRdRp2 paper
rdrp:
  # InterPro entries counted as RdRp (edit this file to add or remove entries)
  interpro_ids: config/rdrp_interpro_ids.tsv
  # Member-database signatures without an InterPro entry (e.g. CDD cd23xxx) count as RdRp
  # when their description matches this pattern
  signature_regex: "RdRp|RdRP_[0-9]|RNA-directed RNA polymerase|RNA-dependent RNA polymerase"
  # Signatures never counted as RdRp: PF05183 = eukaryotic (host) RNA-dependent RNA polymerase
  exclude_signatures: [PF05183]
